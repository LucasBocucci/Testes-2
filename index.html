<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Super Mobile World</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="game-container">
    <div id="ui-overlay">
      <span id="score-text">MOEDAS: 0</span>
      <span id="lives-text">VIDAS: 3</span>
    </div>
    
    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <div id="touch-controls">
      <div class="dpad">
        <button id="btn-left" class="control-btn">◀</button>
        <button id="btn-right" class="control-btn">▶</button>
      </div>
      <div class="actions">
        <button id="btn-jump" class="control-btn action-btn">A</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // UI
    const scoreText = document.getElementById('score-text');
    const livesText = document.getElementById('lives-text');

    // Estado do Jogo
    let score = 0;
    let lives = 3;
    let cameraX = 0;
    const keys = { left: false, right: false, jump: false };

    // Jogador (Mario)
    const player = {
      x: 50,
      y: 300,
      width: 32,
      height: 42,
      vx: 0,
      vy: 0,
      speed: 4.5,
      jumpForce: -11.5,
      gravity: 0.5,
      grounded: false,
      color: '#e74c3c'
    };

    // Cenário
    const levelWidth = 2400;
    const platforms = [
      { x: 0, y: 400, w: 900, h: 50 },
      { x: 1000, y: 400, w: 800, h: 50 },
      { x: 1900, y: 400, w: 600, h: 50 },
      // Plataformas Elevadas
      { x: 250, y: 300, w: 120, h: 20 },
      { x: 420, y: 220, w: 120, h: 20 },
      { x: 600, y: 300, w: 150, h: 20 },
      { x: 1150, y: 280, w: 140, h: 20 },
      { x: 1400, y: 200, w: 140, h: 20 },
      { x: 1650, y: 290, w: 120, h: 20 }
    ];

    let coins = [
      { x: 280, y: 260, collected: false },
      { x: 450, y: 180, collected: false },
      { x: 650, y: 260, collected: false },
      { x: 1200, y: 240, collected: false },
      { x: 1450, y: 160, collected: false },
      { x: 1700, y: 250, collected: false }
    ];

    let enemies = [
      { x: 450, y: 370, w: 30, h: 30, vx: -1.5, minX: 250, maxX: 650, alive: true },
      { x: 1250, y: 370, w: 30, h: 30, vx: -2, minX: 1050, maxX: 1500, alive: true }
    ];

    const flag = { x: 2300, y: 200, w: 20, h: 200 };

    // Suporte a Teclado (PC)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.jump = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.jump = false;
    });

    // Suporte a Controles Touch (Celular)
    function bindTouchButton(id, keyName) {
      const btn = document.getElementById(id);
      const start = (e) => { e.preventDefault(); keys[keyName] = true; };
      const end = (e) => { e.preventDefault(); keys[keyName] = false; };
      btn.addEventListener('touchstart', start);
      btn.addEventListener('touchend', end);
      btn.addEventListener('mousedown', start);
      btn.addEventListener('mouseup', end);
    }

    bindTouchButton('btn-left', 'left');
    bindTouchButton('btn-right', 'right');
    bindTouchButton('btn-jump', 'jump');

    function resetPlayer() {
      player.x = 50;
      player.y = 300;
      player.vx = 0;
      player.vy = 0;
    }

    // Atualização de Física e Lógica
    function update() {
      if (keys.left) player.vx = -player.speed;
      else if (keys.right) player.vx = player.speed;
      else player.vx = 0;

      if (keys.jump && player.grounded) {
        player.vy = player.jumpForce;
        player.grounded = false;
      }

      player.vy += player.gravity;
      player.x += player.vx;

      if (player.x < 0) player.x = 0;

      // Colisão Vertical e Plataformas
      player.grounded = false;
      player.y += player.vy;

      for (let p of platforms) {
        if (
          player.x < p.x + p.w &&
          player.x + player.width > p.x &&
          player.y + player.height > p.y &&
          player.y < p.y + p.h
        ) {
          if (player.vy > 0 && player.y + player.height - player.vy <= p.y + 12) {
            player.y = p.y - player.height;
            player.vy = 0;
            player.grounded = true;
          }
        }
      }

      // Queda nos Buracos
      if (player.y > canvas.height + 100) {
        handleDeath();
      }

      // Câmera Acompanhando o Jogador
      cameraX = player.x - canvas.width / 3;
      if (cameraX < 0) cameraX = 0;
      if (cameraX > levelWidth - canvas.width) cameraX = levelWidth - canvas.width;

      // Coleta de Moedas
      coins.forEach(c => {
        if (!c.collected &&
            player.x < c.x + 20 && player.x + player.width > c.x &&
            player.y < c.y + 20 && player.y + player.height > c.y) {
          c.collected = true;
          score += 100;
          scoreText.innerText = `MOEDAS: ${score}`;
        }
      });

      // Lógica dos Inimigos
      enemies.forEach(e => {
        if (!e.alive) return;

        e.x += e.vx;
        if (e.x <= e.minX || e.x >= e.maxX) e.vx *= -1;

        if (
          player.x < e.x + e.w &&
          player.x + player.width > e.x &&
          player.y < e.y + e.h &&
          player.y + player.height > e.y
        ) {
          // Pular na cabeça do inimigo
          if (player.vy > 0 && player.y + player.height - player.vy <= e.y + 12) {
            e.alive = false;
            player.vy = player.jumpForce * 0.6;
            score += 200;
            scoreText.innerText = `MOEDAS: ${score}`;
          } else {
            handleDeath();
          }
        }
      });

      // Vitória ao Chegar no Mastro Final
      if (player.x + player.width >= flag.x) {
        alert('🎉 Você completou a fase! Parabéns!');
        resetPlayer();
      }
    }

    function handleDeath() {
      lives--;
      livesText.innerText = `VIDAS: ${lives}`;
      if (lives <= 0) {
        alert('💥 Game Over! Reiniciando...');
        lives = 3;
        score = 0;
        scoreText.innerText = 'MOEDAS: 0';
        livesText.innerText = 'VIDAS: 3';
        coins.forEach(c => c.collected = false);
        enemies.forEach(e => e.alive = true);
      }
      resetPlayer();
    }

    // Renderização dos Gráficos
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(-cameraX, 0);

      // Fundo (Céu)
      ctx.fillStyle = '#5c94fc';
      ctx.fillRect(cameraX, 0, canvas.width, canvas.height);

      // Plataformas
      platforms.forEach(p => {
        ctx.fillStyle = '#2ecc71';
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = '#27ae60';
        ctx.fillRect(p.x, p.y + 6, p.w, p.h - 6);
      });

      // Moedas
      coins.forEach(c => {
        if (!c.collected) {
          ctx.fillStyle = '#f1c40f';
          ctx.beginPath();
          ctx.arc(c.x + 10, c.y + 10, 8, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      // Inimigos
      enemies.forEach(e => {
        if (e.alive) {
          ctx.fillStyle = '#8e44ad';
          ctx.fillRect(e.x, e.y, e.w, e.h);
        }
      });

      // Bandera / Linha de Chegada
      ctx.fillStyle = '#e67e22';
      ctx.fillRect(flag.x, flag.y, flag.w, flag.h);
      ctx.fillStyle = '#f1c40f';
      ctx.beginPath();
      ctx.moveTo(flag.x + flag.w, flag.y);
      ctx.lineTo(flag.x + flag.w + 35, flag.y + 20);
      ctx.lineTo(flag.x + flag.w, flag.y + 40);
      ctx.fill();

      // Jogador
      ctx.fillStyle = player.color;
      ctx.fillRect(player.x, player.y, player.width, player.height);
      // Detalhe dos Olhos
      ctx.fillStyle = '#fff';
      ctx.fillRect(player.x + (player.vx >= 0 ? 20 : 4), player.y + 8, 6, 8);

      ctx.restore();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
